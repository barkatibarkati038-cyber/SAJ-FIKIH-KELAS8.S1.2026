    // =========================================================================

    function fisherYatesShuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareShuffledQuestions(questions) {
      const shuffledList = fisherYatesShuffle(questions);
      return shuffledList.map((q) => {
        if ((q.type === "mc" || q.type === "mc_complex") && Array.isArray(q.options)) {
          return {
            ...q,
            options: fisherYatesShuffle(q.options)
          };
        }
        return { ...q };
      });
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const pad = (n) => String(n).padStart(2, "0");
      if (hrs > 0) {
        return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
      return `${pad(mins)}:${pad(secs)}`;
    }

    function getLocalTodayDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

      if (answer === undefined || answer === null) return false;
      if (question.type === "mc_complex") {

    // =========================================================================
    // KOMPONEN UTAMA APLIKASI (APP)
    // =========================================================================
    function App() {
      // Status halaman: 'LOGIN' | 'EXAM' | 'RESULT'
      const [screen, setScreen] = useState("LOGIN");
      const [savedSession, setSavedSession] = useState(null);

      // State Ujian
      const [studentInfo, setStudentInfo] = useState({ nama: "", kelas: "", tanggal: getLocalTodayDate() });
      const [questions, setQuestions] = useState([]);
      const [answers, setAnswers] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(EXAM_CONFIG.durationMinutes * 60);
      const [violations, setViolations] = useState(0);

      // State Hasil & Modal
      const [resultData, setResultData] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [alertModal, setAlertModal] = useState({
        isOpen: false,
        title: "",
        message: "",
        buttonText: "Saya Mengerti",
        variant: "danger"
      });
      const [confirmModal, setConfirmModal] = useState({
        isOpen: false,
        title: "",
        message: "",
        confirmText: "Ya, Lanjutkan",
        confirmVariant: "primary",
        actionType: null // 'SUBMIT' | 'RESET_STORAGE'
      });

      // Refs untuk mencegah stale closure di event listener & mencegah double-trigger
      const latestStateRef = useRef({});
      const isSubmittedRef = useRef(false);
      const lastViolationTsRef = useRef(0);
      const wasFullscreenRef = useRef(false);

      latestStateRef.current = {
        screen,
        studentInfo,
        questions,
        answers,
        currentIndex,
        timeLeft,
        violations
      };

      // Cek sesi tersimpan di LocalStorage saat pertama kali dimuat
      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.studentInfo && Array.isArray(parsed.questions) && parsed.questions.length > 0) {
              setSavedSession(parsed);
            }
          }
        } catch (err) {
          console.error("Gagal membaca LocalStorage:", err);
        }
      }, []);

      // Helper Request Fullscreen
      const requestAppFullscreen = useCallback(() => {
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;
        if (req) {
          Promise.resolve(req.call(el))
            .then(() => {
              wasFullscreenRef.current = true;
            })
            .catch(() => {
              // Diabaikan jika browser membatasi fullscreen tanpa gesture tertentu
            });
        }
      }, []);

      // Auto-Save Real-time ke LocalStorage selama EXAM aktif
      useEffect(() => {
        if (screen !== "EXAM" || isSubmittedRef.current) return;
        try {
          const payload = {
            studentInfo,
            questions,
            answers,
            currentIndex,
            timeLeft,
            violations,
            updatedAt: Date.now()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          console.error("Gagal menyimpan progres ke LocalStorage:", err);
        }
      }, [screen, studentInfo, questions, answers, currentIndex, timeLeft, violations]);

      // Fungsi Pengiriman ke Google Sheets
      const sendToGoogleSheets = useCallback(async (payload) => {
        setIsUploading(true);
        try {
          await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain"
            },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error("Error pengiriman ke Google Sheets:", err);
        } finally {
          setIsUploading(false);
        }
      }, []);

      // Fungsi Penilaian Runtut (ID 1 -> N) & Submit Ujian
      const finalizeAndSubmitExam = useCallback(
        (keteranganSelesai, overrideViolations) => {
          if (isSubmittedRef.current) return;
          isSubmittedRef.current = true;

          const {
            studentInfo: info,
            questions: activeQuestions,
            answers: studentAnswers,
            violations: currentViolations
          } = latestStateRef.current;

          const finalViolations =
            typeof overrideViolations === "number" ? overrideViolations : currentViolations;

          // Urutkan kembali soal berdasarkan ID nomor soal asli (1 sampai N)
          const sortedByOriginalId = [...activeQuestions].sort((a, b) => a.id - b.id);

          let totalAuto = 0;
          let correctAuto = 0;
          let manualCount = 0;
          const rincianList = [];

          sortedByOriginalId.forEach((q) => {
            const ans = studentAnswers[q.id];
            const answered = isQuestionAnswered(q, ans);

            if (q.type === "mc") {
              totalAuto += 1;
              if (!answered) {
                rincianList.push(`Soal ${q.id}: KOSONG`);
              } else if (ans === q.answer) {
                correctAuto += 1;
                rincianList.push(`Soal ${q.id}: BENAR`);
              } else {
                rincianList.push(`Soal ${q.id}: SALAH (Pilih: ${ans}, Kunci: ${q.answer})`);
              }
            } else if (q.type === "mc_complex") {
              totalAuto += 1;
              if (!answered) {
                rincianList.push(`Soal ${q.id}: KOSONG`);
              } else {
                const userStr = [...ans].sort().join(",");
                const keyStr = [...q.answer].sort().join(",");
                if (userStr === keyStr) {
                  correctAuto += 1;
                  rincianList.push(`Soal ${q.id}: BENAR`);
                } else {
                  rincianList.push(`Soal ${q.id}: SALAH (Pilih: ${userStr}, Kunci: ${keyStr})`);
                }
              }
            } else {
              // Tipe 'short' (Isian Singkat) atau 'essay' (Uraian) - Diperiksa oleh Guru
              manualCount += 1;
              if (!answered) {
                rincianList.push(`Soal ${q.id}: KOSONG`);
              } else {
                // Pastikan seluruh kalimat jawaban siswa masuk tanpa dipotong
                const cleanFullAnswer = String(ans).replace(/\s*\|\s*/g, " / ").trim();
                rincianList.push(
                  `Soal ${q.id}: DIPERIKSA GURU (Jawaban: ${cleanFullAnswer} | Kunci: ${q.answer})`
                );
              }
            }
          });

          const skorAkhir = totalAuto > 0 ? Math.round((correctAuto / totalAuto) * 100) : 0;
          const rincianJawabanString = rincianList.join(" | ");

          const sheetPayload = {
            nama: info.nama,
            kelas: info.kelas,
            tanggal: info.tanggal,
            skor: skorAkhir,
            pelanggaran: finalViolations,
            keterangan: keteranganSelesai,
            rincianJawaban: rincianJawabanString
          };

          // Hapus data dari LocalStorage setelah ujian berhasil disubmit
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {}

          // Keluar dari fullscreen dengan aman jika masih aktif
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          }

          setAlertModal((prev) => ({ ...prev, isOpen: false }));
          setConfirmModal((prev) => ({ ...prev, isOpen: false }));
          setResultData({
            ...sheetPayload,
            correctAuto,
            totalAuto,
            manualCount
          });
          setScreen("RESULT");

          sendToGoogleSheets(sheetPayload);
        },
        [sendToGoogleSheets]
      );

      // Handler Pelanggaran Anti-Cheat
      const registerViolation = useCallback(
        (reason) => {
          if (latestStateRef.current.screen !== "EXAM" || isSubmittedRef.current) return;

          // Debounce 1.2 detik agar 1 aksi Alt+Tab tidak terhitung ganda oleh visibilitychange + fullscreenchange
          const now = Date.now();
          if (now - lastViolationTsRef.current < 1200) return;
          lastViolationTsRef.current = now;

          const nextViolation = latestStateRef.current.violations + 1;
          setViolations(nextViolation);

          if (nextViolation === 1) {
            setAlertModal({
              isOpen: true,
              title: "PERINGATAN PELANGGARAN KE-1!",
              message: `Sistem mendeteksi aktivitas terlarang (${reason}).\n\nAnda dilarang meninggalkan layar ujian atau keluar dari mode Fullscreen. Jika Anda melakukan 1 pelanggaran lagi, ujian akan otomatis dikunci dan dikumpulkan!`,
              buttonText: "Kembali ke Ujian (Fullscreen)",
              variant: "danger"
            });
          } else if (nextViolation >= 2) {
            finalizeAndSubmitExam(
              `Auto-Submit (Pelanggaran Anti-Cheat Ke-${nextViolation}: ${reason})`,
              nextViolation
            );
          }
        },
        [finalizeAndSubmitExam]
      );

      // Listener Deteksi visibilitychange & fullscreenchange & Shortcut Keyboard
      useEffect(() => {
        if (screen !== "EXAM") return;

        const handleVisibilityChange = () => {
          if (document.hidden) {
            registerViolation("Pindah Tab / Meminimalkan Browser");
          }
        };

        const handleFullscreenChange = () => {
          if (document.fullscreenElement) {
            wasFullscreenRef.current = true;
          } else if (wasFullscreenRef.current) {
            registerViolation("Keluar dari Mode Fullscreen");
          }
        };

        const handleKeyDown = (e) => {
          const key = e.key.toLowerCase();
          if (
            e.key === "F12" ||
            e.key === "PrintScreen" ||
            (e.ctrlKey && ["c", "v", "x", "u", "s", "p", "a"].includes(key)) ||
            (e.metaKey && ["c", "v", "x", "u", "s", "p", "a"].includes(key))
          ) {
            e.preventDefault();
          }
        };

        document.addEventListener("visibilitychange", handleVisibilityChange);
        document.addEventListener("fullscreenchange", handleFullscreenChange);
        document.addEventListener("keydown", handleKeyDown);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          document.removeEventListener("fullscreenchange", handleFullscreenChange);
          document.removeEventListener("keydown", handleKeyDown);
        };
      }, [screen, registerViolation]);

      // Timer Hitung Mundur Otomatis
      useEffect(() => {
        if (screen !== "EXAM") return;

        const intervalId = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(intervalId);
              finalizeAndSubmitExam("Auto-Submit (Waktu Ujian Habis)");
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(intervalId);
      }, [screen, finalizeAndSubmitExam]);

      // Mulai Ujian Baru
      const handleStartNewExam = (info) => {
        isSubmittedRef.current = false;
        wasFullscreenRef.current = false;
        const shuffled = prepareShuffledQuestions(rawQuestionsData);
        setStudentInfo(info);
        setQuestions(shuffled);
        setAnswers({});
        setCurrentIndex(0);
        setTimeLeft(EXAM_CONFIG.durationMinutes * 60);
        setViolations(0);
        setSavedSession(null);
        setScreen("EXAM");
        requestAppFullscreen();
      };

      // Lanjutkan Sesi dari LocalStorage
      const handleResumeSession = () => {
        if (!savedSession) return;
        isSubmittedRef.current = false;
        wasFullscreenRef.current = false;
        setStudentInfo(savedSession.studentInfo);
        setQuestions(savedSession.questions);
        setAnswers(savedSession.answers || {});
        setCurrentIndex(savedSession.currentIndex || 0);
        setTimeLeft(savedSession.timeLeft || EXAM_CONFIG.durationMinutes * 60);
        setViolations(savedSession.violations || 0);
        setScreen("EXAM");
        requestAppFullscreen();
      };

      // Konfirmasi Hapus Progres Tersimpan
      const handleRequestResetSaved = () => {
        setConfirmModal({
          isOpen: true,
          title: "Hapus Progres Ujian?",
          message: "Seluruh jawaban dan sisa waktu yang tersimpan pada sesi sebelumnya akan dihapus permanen. Lanjutkan?",
          confirmText: "Ya, Hapus Progres",
          confirmVariant: "danger",
          actionType: "RESET_STORAGE"
        });
      };

      // Konfirmasi Sebelum Selesai & Kumpulkan
      const handleRequestManualSubmit = () => {
        const answeredCount = questions.reduce(
          (acc, q) => acc + (isQuestionAnswered(q, answers[q.id]) ? 1 : 0),
          0
        );
        const unansweredCount = questions.length - answeredCount;

        const warningNote =
          unansweredCount > 0
            ? `Masih terdapat ${unansweredCount} soal yang BELUM dijawab.\n\n`
            : "Semua soal sudah Anda jawab.\n\n";

        setConfirmModal({
          isOpen: true,
          title: "Konfirmasi Pengumpulan Ujian",
          message: `${warningNote}Terjawab: ${answeredCount} dari ${questions.length} soal.\nApakah Anda yakin ingin mengakhiri ujian dan mengirimkan jawaban sekarang?`,
          confirmText: "Ya, Selesai & Kumpulkan",
          confirmVariant: "primary",
          actionType: "SUBMIT"
        });
      };

      const handleConfirmAction = () => {
        const action = confirmModal.actionType;
        setConfirmModal((prev) => ({ ...prev, isOpen: false }));

        if (action === "RESET_STORAGE") {
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {}
          setSavedSession(null);
        } else if (action === "SUBMIT") {
          finalizeAndSubmitExam("Selesai Normal (Dikumpulkan Siswa)");
        }
      };

      const handleAnswerChange = useCallback((questionId, value) => {
        setAnswers((prev) => ({
          ...prev,
          [questionId]: value
        }));
      }, []);

      const activeQuestion = questions[currentIndex];

      return (
        <div
          className={`min-h-screen flex flex-col ${screen === "EXAM" ? "exam-protected" : ""}`}
          onContextMenu={(e) => {
            if (screen === "EXAM") e.preventDefault();
          }}
          onCopy={(e) => {
            if (screen === "EXAM") e.preventDefault();
          }}
          onCut={(e) => {
            if (screen === "EXAM") e.preventDefault();
          }}
          onPaste={(e) => {
            if (screen === "EXAM") e.preventDefault();
          }}
        >
          <AppHeader
            timerSeconds={timeLeft}
            violations={violations}
            isExamActive={screen === "EXAM"}
          />

          <div className="flex-1">
            {screen === "LOGIN" && (
              <LoginScreen
                savedSession={savedSession}
                onResumeSession={handleResumeSession}
                onResetSavedSession={handleRequestResetSaved}
                onStartExam={handleStartNewExam}
              />
            )}

            {screen === "EXAM" && activeQuestion && (
              <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                  {/* Area Soal & Jawaban (Kiri / Tengah) */}
                  <div className="lg:col-span-8">
                    <QuestionArea
                      question={activeQuestion}
                      questionIndex={currentIndex}
                      totalQuestions={questions.length}
                      answer={answers[activeQuestion.id]}
                      onAnswerChange={handleAnswerChange}
                      onPrev={() => setCurrentIndex((i) => Math.max(0, i - 1))}
                      onNext={() => setCurrentIndex((i) => Math.min(questions.length - 1, i + 1))}
                      onRequestSubmit={handleRequestManualSubmit}
                    />
                  </div>

                  {/* Navigasi Kotak Nomor Soal (Kanan / Bawah) */}
                  <div className="lg:col-span-4 lg:sticky lg:top-24">
                    <NavigationSidebar
                      studentInfo={studentInfo}
                      questions={questions}
                      answers={answers}
                      currentIndex={currentIndex}
                      onSelectIndex={setCurrentIndex}
                      onRequestSubmit={handleRequestManualSubmit}
                    />
                  </div>
                </div>
              </main>
            )}

            {screen === "RESULT" && resultData && (
              <ResultScreen
                resultData={resultData}
                isUploading={isUploading}
                onRetryUpload={() =>
                  sendToGoogleSheets({
                    nama: resultData.nama,
                    kelas: resultData.kelas,
                    tanggal: resultData.tanggal,
                    skor: resultData.skor,
                    pelanggaran: resultData.pelanggaran,
                    keterangan: resultData.keterangan,
                    rincianJawaban: resultData.rincianJawaban
                  })
                }
              />
            )}
          </div>

          {/* Custom Alert Modal (Anti-Flicker: didefinisikan di luar App) */}
          <AlertModal
            isOpen={alertModal.isOpen}
            title={alertModal.title}
            message={alertModal.message}
            buttonText={alertModal.buttonText}
            variant={alertModal.variant}
            onClose={() => {
              setAlertModal((prev) => ({ ...prev, isOpen: false }));
              if (screen === "EXAM") {
                requestAppFullscreen();
              }
            }}
          />

          {/* Custom Confirm Modal (Anti-Flicker: didefinisikan di luar App) */}
          <ConfirmModal
            isOpen={confirmModal.isOpen}
            title={confirmModal.title}
            message={confirmModal.message}
            confirmText={confirmModal.confirmText}
            confirmVariant={confirmModal.confirmVariant}
            onConfirm={handleConfirmAction}
            onCancel={() => setConfirmModal((prev) => ({ ...prev, isOpen: false }))}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
